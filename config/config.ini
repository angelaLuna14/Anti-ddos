# Anti-DDoS Protection Configuration
# ==================================

[general]
daemon_mode = true
log_file = /var/log/antiddos/antiddos.log
log_level = INFO
pid_file = /var/run/antiddos.pid

[rate_limiting]
max_requests_per_second = 100
max_requests_per_minute = 1000
max_requests_per_hour = 10000
burst_size = 50
window_size_seconds = 60
block_duration_seconds = 300
enable_adaptive = true
sensitivity = 0.5

[behavioral_analysis]
learning_mode = false
min_samples = 1000
bot_threshold = 0.7
attack_threshold = 0.8
rate_limit_per_second = 100
rate_limit_per_minute = 1000

[geo_blocking]
enabled = false
database_path = /var/lib/antiddos/geoip.csv
block_datacenters = false
block_proxies = false
block_tor = false
block_vpn = false

[vpn_detection]
enabled = true
block_vpn = false
block_tor = true
custom_ports = 1194,51820,500,4500

[firewall]
auto_block = true
block_duration = 300
max_blocks_per_hour = 100
whitelist_private_ips = true

[notifications]
enabled = true
email = admin@example.com
webhook_url = 
alert_threshold = HIGH

[performance]
max_connections = 10000
connection_timeout = 30
cleanup_interval = 300
stats_interval = 60

[network]
interface = auto
capture_mode = promiscuous
buffer_size = 4096
max_packets_per_second = 100000